# Thriwe 골프 자동 예약 설정 (Emirates NBD, Golf Access)
# copy config.example.toml config.toml 후 [vars] 를 원하는 값으로 수정하세요.
#
# 로그인 ~ 날짜/시간 선택(Apply)까지는 실제 사이트에서 녹화(playwright codegen)한 selector 입니다.
# 결제 화면에서 카드 정보까지 자동 입력하고, --dry-run 은 Pay 버튼 직전에서 멈춥니다. 카드 OTP 는 직접 입력합니다.
# selector 문법: https://playwright.dev/python/docs/locators
#   role=button[name="Login"]        이름 전체 일치 (버튼은 이 형식: "Next" 가 "Next Month" 와 헷갈리지 않음)
#   role=radio[name=/Abu dhabi/i]    이름 일부 일치 (정규식, i = 대소문자 무시)

[site]
base_url = "https://emiratesnbdbenefits.thriwe.com"

[schedule]
timezone = "Asia/Dubai"       # 아부다비 시간 (UTC+4)
open_time = "00:00:00"        # 예약 오픈 시각
days_ahead = 15               # 오픈 날짜 기준 며칠 뒤를 예약할지 (Thriwe: 수요일 자정 이후 -> 다음 주 금요일 = +15일)

[browser]
headless = false              # 3D Secure 인증 등을 직접 볼 수 있도록 화면 표시 권장
channel = ""                  # 설치된 Chrome 을 쓰려면 "chrome"
timeout_ms = 15000
reuse_login = false
keep_open_seconds = 600       # 종료/실패 후에도 브라우저를 10분 열어 둠 (직접 이어서 진행 가능)

# steps 에서 쓸 수 있는 변수:
#   {email} {password} {card_number} {card_expiry} {card_cvv} {card_name}  (.env)
#   {play_date_label}  예) Thursday, October 22nd, 2026  (달력 날짜 이름, 자동 계산)
#   아래 [vars] 값
[vars]
course = "Abu dhabi City club"   # 골프장 목록에 보이는 이름 (일부만 써도 됨, 대소문자 무시)
tee_hour = "08"
tee_minute = "10"
tee_ampm = "AM"
booking_type = "Complimentary"   # 또는 "Discounted"
region = ""                      # 골프장 화면에서 먼저 고를 지역 (기본 지역이면 비움). 예) "Sharjah"

# 언제 뜰지 모르는 안내 팝업: 클릭하려는 순간 화면을 가리고 있으면 selector 를 눌러 닫음
[[dismiss]]
name = "Meet AINA 안내창"
selector = 'text=/browse manually instead/i'

# ---------- 1. 로그인 (오픈 10분 전쯤) ----------
[[steps]]
action = "goto"
url = "https://emiratesnbdbenefits.thriwe.com/login"
wait_until = "networkidle"    # 로그인 화면이 다 그려질 때까지 대기

[[steps]]
action = "fill"
selector = 'role=textbox[name=/Enter your registered email/i]'
value = "{email}"
press = "Tab"
retry_seconds = 10

[[steps]]
action = "fill"
selector = 'role=textbox[name=/Enter your Password/i]'
value = "{password}"
retry_seconds = 10

# Login 직전에 이메일이 그대로 있는지 한 번 더 확인 (지워졌으면 다시 입력)
[[steps]]
action = "fill"
selector = 'role=textbox[name=/Enter your registered email/i]'
value = "{email}"
retry_seconds = 10

[[steps]]
action = "click"
selector = 'role=button[name="Login"]'

# 로그인 후 안내 팝업 (안 뜰 수도 있으므로 optional). 로그인 응답이 늦을 수 있어 넉넉히 기다림
[[steps]]
action = "click"
selector = 'role=button[name="Click to proceed"]'
optional = true
attempt_timeout_ms = 15000

[[steps]]
action = "click"
selector = 'role=button[name="Close"]'
optional = true

[[steps]]
action = "wait_for"
selector = 'role=heading[name="Golf Access"]'

# ---------- 2. 아부다비 자정까지 대기 ----------
# 달력의 선택 가능 날짜가 페이지를 연 시점에 정해질 수 있으므로,
# 자정이 지난 뒤에 예약 화면에 들어가도록 여기서 기다린다.
[[steps]]
action = "wait_until_open"
early_seconds = 0

# ---------- 3. 골프장 선택 ----------
[[steps]]
action = "click"
selector = 'role=heading[name="Golf Access"]'

[[steps]]
action = "click"
selector = 'role=button[name="Book Now"]'
until = 'text="Select Your Card"'
same_page = 'role=button[name="Book Now"]'

# Booking for Myself 화면: 저장된 카드가 선택돼 있고 Booking Type 은 Complimentary 가 기본값.
# 카드 목록이 다 뜨기 전에 Next 를 누르면 무시될 수 있음 -> 아래 Next 단계에서 화면이 그대로면 다시 누름
[[steps]]
action = "wait_for"
selector = 'text="{booking_type}"'

[[steps]]
action = "click"
selector = 'text="{booking_type}"'
optional = true

# Next 는 화면마다 이름이 같아서, 카드 화면에 그대로 있을 때(same_page)만 다시 누름.
# 골프장 화면 판단: 기본 지역 골프장 이름 또는 지역 라디오가 보이면 넘어간 것
[[steps]]
action = "click"
selector = 'role=button[name="Next"]'
until = ['text=/{course}/i', 'role=radio[name=/^(Abu Dhabi|Dubai|Sharjah|Ras Al Khaimah|Ajman|Fujairah)$/i]']
same_page = 'text="Select Your Card"'

# 지역 선택 (region 이 비어 있으면 건너뜀 = 기본 지역). 예) --region Sharjah
[[steps]]
action = "click"
selector = 'text="{region}"'
skip_if_empty = "{region}"
retry_seconds = 10
optional = true

[[steps]]
action = "check"
selector = 'role=radio[name="{region}"]'
force = true
skip_if_empty = "{region}"
retry_seconds = 10

# 골프장 선택: 화면에 보이는 골프장 이름 글자를 클릭 (목록이 뜰 때까지 최대 10초)
[[steps]]
action = "click"
selector = 'text=/{course}/i >> visible=true'
retry_seconds = 10
optional = true

# 라디오 버튼에 이름이 있는 골프장(아부다비 등)은 이름으로 체크
[[steps]]
action = "check"
selector = 'role=radio[name=/{course}/i]'
force = true
optional = true
attempt_timeout_ms = 1000
unless_checked = ['role=radio[name=/{course}/i]', 'label:has-text("{course}") input[type="radio"]']

# 이름이 없는 라디오(샤르자 등): 골프장 라벨 안쪽 동그라미 클릭 (녹화한 동작과 동일)
[[steps]]
action = "click"
selector = 'label:has-text("{course}") >> label'
optional = true
attempt_timeout_ms = 1000
unless_checked = ['role=radio[name=/{course}/i]', 'label:has-text("{course}") input[type="radio"]']

[[steps]]
action = "check"
selector = 'label:has-text("{course}") input[type="radio"]'
force = true
optional = true
attempt_timeout_ms = 1000
unless_checked = ['role=radio[name=/{course}/i]', 'label:has-text("{course}") input[type="radio"]']

# 원하는 골프장이 실제로 선택됐는지 확인 (안 되면 다른 골프장이 예약되지 않도록 여기서 중단)
[[steps]]
action = "assert_checked"
selectors = ['role=radio[name=/{course}/i]', 'label:has-text("{course}") input[type="radio"]']
retry_seconds = 5

[[steps]]
action = "click"
selector = 'role=button[name="Next"]'
until = ".fa.fa-calendar"
same_page = 'text=/{course}/i'

# ---------- 4. 날짜 선택 ----------
[[steps]]
action = "click"
selector = ".fa.fa-calendar"

# 예약 날짜가 다음 달이면 달력을 넘김 (막혀 있든 열려 있든 그 날짜가 보이면 건너뜀)
[[steps]]
action = "click"
selector = 'role=button[name="Next Month"]'
only_if_missing = 'role=option[name=/{play_date_label}/]'
optional = true

# 열린 날짜만 이름이 "Choose ..." 로 시작하므로, 열릴 때까지 재시도
[[steps]]
action = "click"
selector = 'role=option[name=/^Choose {play_date_label}/]'
retry_seconds = 30

# ---------- 5. 시간 선택 ----------
[[steps]]
action = "click"
selector = 'role=textbox[name=/Select Time of play/i]'

[[steps]]
action = "select"
selector = "#pickup_hours"
value = "{tee_hour}"

[[steps]]
action = "select"
selector = "#pickup_minutes"
value = "{tee_minute}"

[[steps]]
action = "select"
selector = "#pickup_format"
value = "{tee_ampm}"

[[steps]]
action = "click"
selector = 'role=button[name="Apply"]'

[[steps]]
action = "screenshot"
name = "date_time_selected"

# ---------- 6. 예약 요약 -> 결제 ----------
# 날짜/시간 화면의 Next. 이 화면에 그대로 있을 때(시간 입력칸이 보일 때)만 다시 누름
[[steps]]
action = "click"
selector = 'role=button[name="Next"]'
until = 'role=button[name="Proceed To Payment"]'
same_page = 'role=textbox[name=/Select Time of play/i]'

[[steps]]
action = "screenshot"
name = "booking_summary"

# 결제 화면(payments.thriwe.com)으로 이동. 이 화면에 그대로 있을 때만 다시 누름
[[steps]]
action = "click"
selector = 'role=button[name="Proceed To Payment"]'
until = 'input[placeholder="CVV"]'
same_page = 'role=button[name="Proceed To Payment"]'
until_timeout_ms = 30000

# ---------- 7. 카드 정보 입력 (.env 의 CARD_*) ----------
# 카드번호 앞 6자리 / 뒤 4자리는 미리 채워져 있어 가운데 자리만 입력
[[steps]]
action = "fill"
selector = 'input[placeholder^="XXX"]'
value = "{card_middle}"
verify = false
skip_if_empty = "{card_middle}"

[[steps]]
action = "fill"
selector = 'input[placeholder="MM"]'
value = "{card_exp_month}"
verify = false
skip_if_empty = "{card_exp_month}"

[[steps]]
action = "fill"
selector = 'input[placeholder="YY"]'
value = "{card_exp_year}"
verify = false
skip_if_empty = "{card_exp_year}"

# CARD_CVV 를 비워 두면 건너뛰고 직접 입력 (아래 pause 단계에서 기다림)
[[steps]]
action = "fill"
selector = 'input[placeholder="CVV"]'
value = "{card_cvv}"
verify = false
skip_if_empty = "{card_cvv}"

[[steps]]
action = "fill"
selector = 'input[placeholder="Name on card"]'
value = "{card_name}"
verify = false
skip_if_empty = "{card_name}"
optional = true

[[steps]]
action = "screenshot"
name = "payment_filled"

# Pay 버튼. --dry-run 이면 여기서 멈춤. CVV 가 없으면 누르지 않고 직접 입력 후 누르도록 둠
[[steps]]
action = "click"
selector = 'role=button[name=/^Pay/]'
final = true
skip_if_empty = "{card_cvv}"

# 카드 OTP(3D Secure) 는 직접 입력. 완료 문구가 보이거나 30분이 지나면 종료
[[steps]]
action = "pause"
message = "OTP 가 뜨면 직접 입력하세요 (CVV 를 저장하지 않았다면 CVV 입력 후 Pay 를 누르세요)"
selector = 'text=/(booking|payment).*(confirmed|successful|success)/i'
timeout_ms = 1800000
optional = true

[[steps]]
action = "screenshot"
name = "after_payment"
