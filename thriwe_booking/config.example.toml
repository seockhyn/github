# Thriwe 골프 자동 예약 설정 (Emirates NBD, Golf Access)
# copy config.example.toml config.toml 후 [vars] 를 원하는 값으로 수정하세요.
#
# 로그인 ~ 날짜/시간 선택(Apply)까지는 실제 사이트에서 녹화(playwright codegen)한 selector 입니다.
# Apply 이후(확인/카드 입력/결제) 화면은 아직 녹화 전이라, 지금은 Apply 다음 단계에서 멈추도록 해 두었습니다.
# selector 문법: https://playwright.dev/python/docs/locators
#   role=button[name="Login"]        이름 전체 일치 (버튼은 이 형식: "Next" 가 "Next Month" 와 헷갈리지 않음)
#   role=radio[name=/Abu dhabi/i]    이름 일부 일치 (정규식, i = 대소문자 무시)

[site]
base_url = "https://emiratesnbdbenefits.thriwe.com"

[schedule]
timezone = "Asia/Dubai"       # 아부다비 시간 (UTC+4)
open_time = "00:00:00"        # 예약 오픈 시각
days_ahead = 14               # 오픈 날짜 기준 며칠 뒤를 예약할지

[browser]
headless = false              # 3D Secure 인증 등을 직접 볼 수 있도록 화면 표시 권장
channel = ""                  # 설치된 Chrome 을 쓰려면 "chrome"
timeout_ms = 15000
reuse_login = false
keep_open_seconds = 30        # 종료 전 결과 화면을 잠시 띄워 둠

# steps 에서 쓸 수 있는 변수:
#   {email} {password} {card_number} {card_expiry} {card_cvv} {card_name}  (.env)
#   {play_date_label}  예) Thursday, October 22nd, 2026  (달력 날짜 이름, 자동 계산)
#   아래 [vars] 값
[vars]
course = "Abu dhabi City club"   # 골프장 목록에 보이는 이름 (일부만 써도 됨, 대소문자 무시)
tee_hour = "08"
tee_minute = "10"
tee_ampm = "AM"

# 언제 뜰지 모르는 안내 팝업: 클릭하려는 순간 화면을 가리고 있으면 selector 를 눌러 닫음
[[dismiss]]
name = "Meet AINA 안내창"
selector = 'text=/browse manually instead/i'

# ---------- 1. 로그인 (오픈 10분 전쯤) ----------
[[steps]]
action = "goto"
url = "https://emiratesnbdbenefits.thriwe.com/login"
wait_until = "networkidle"    # 로그인 화면이 다 그려질 때까지 대기

[[steps]]
action = "fill"
selector = 'role=textbox[name=/Enter your registered email/i]'
value = "{email}"
press = "Tab"
retry_seconds = 10

[[steps]]
action = "fill"
selector = 'role=textbox[name=/Enter your Password/i]'
value = "{password}"
retry_seconds = 10

# Login 직전에 이메일이 그대로 있는지 한 번 더 확인 (지워졌으면 다시 입력)
[[steps]]
action = "fill"
selector = 'role=textbox[name=/Enter your registered email/i]'
value = "{email}"
retry_seconds = 10

[[steps]]
action = "click"
selector = 'role=button[name="Login"]'

# 로그인 후 안내 팝업 (안 뜰 수도 있으므로 optional). 로그인 응답이 늦을 수 있어 넉넉히 기다림
[[steps]]
action = "click"
selector = 'role=button[name="Click to proceed"]'
optional = true
attempt_timeout_ms = 15000

[[steps]]
action = "click"
selector = 'role=button[name="Close"]'
optional = true

[[steps]]
action = "wait_for"
selector = 'role=heading[name="Golf Access"]'

# ---------- 2. 아부다비 자정까지 대기 ----------
# 달력의 선택 가능 날짜가 페이지를 연 시점에 정해질 수 있으므로,
# 자정이 지난 뒤에 예약 화면에 들어가도록 여기서 기다린다.
[[steps]]
action = "wait_until_open"
early_seconds = 0

# ---------- 3. 골프장 선택 ----------
[[steps]]
action = "click"
selector = 'role=heading[name="Golf Access"]'

[[steps]]
action = "click"
selector = 'role=button[name="Book Now"]'

[[steps]]
action = "click"
selector = 'role=button[name="Next"]'

# 라디오 버튼 위를 디자인용 라벨이 덮고 있어서, 사람처럼 골프장 이름(라벨)을 클릭
[[steps]]
action = "click"
selector = 'label:has-text("{course}")'
retry_seconds = 10

# 선택이 확실히 됐는지 확인 (이미 선택돼 있으면 그대로 통과)
[[steps]]
action = "check"
selector = 'role=radio[name=/{course}/i]'
force = true

[[steps]]
action = "click"
selector = 'role=button[name="Next"]'

# ---------- 4. 날짜 선택 ----------
[[steps]]
action = "click"
selector = ".fa.fa-calendar"

# 예약 날짜가 다음 달이면 달력을 넘김 (막혀 있든 열려 있든 그 날짜가 보이면 건너뜀)
[[steps]]
action = "click"
selector = 'role=button[name="Next Month"]'
only_if_missing = 'role=option[name=/{play_date_label}/]'
optional = true

# 열린 날짜만 이름이 "Choose ..." 로 시작하므로, 열릴 때까지 재시도
[[steps]]
action = "click"
selector = 'role=option[name=/^Choose {play_date_label}/]'
retry_seconds = 30

# ---------- 5. 시간 선택 ----------
[[steps]]
action = "click"
selector = 'role=textbox[name=/Select Time of play/i]'

[[steps]]
action = "select"
selector = "#pickup_hours"
value = "{tee_hour}"

[[steps]]
action = "select"
selector = "#pickup_minutes"
value = "{tee_minute}"

[[steps]]
action = "select"
selector = "#pickup_format"
value = "{tee_ampm}"

[[steps]]
action = "click"
selector = 'role=button[name="Apply"]'

[[steps]]
action = "screenshot"
name = "date_time_selected"

# ---------- 6. 이후 단계 (아직 녹화 전) ----------
# Apply 다음 화면(확인/카드 입력/결제)을 녹화하면 아래를 실제 selector 로 교체합니다.
# 그 전까지는 이 단계에서 --dry-run 이 멈추도록 final = true 로 둡니다.
[[steps]]
action = "click"
selector = 'role=button[name="Next"]'
final = true
